<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" height="430" role="img" aria-labelledby="t d">
<title id="t">Interest rate by utilization</title>
<desc id="d">Borrow rate rises slowly up to 80 % utilization (4 %) and steeply after it, reaching 79 % at 100 %. The supply rate is the borrow rate times the utilization and meets it at 100 %.</desc>
<style>
  text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  .ink { fill: #1f2328; } .mut { fill: #59636e; }
  .grid { stroke: #d1d9e0; stroke-width: 1; } .axis { stroke: #8c959f; stroke-width: 1; }
  .kink { stroke: #8c959f; stroke-width: 1; stroke-dasharray: 5 4; }
  .b { stroke: #2a78d6; } .s { stroke: #eb6834; } .bf { fill: #2a78d6; } .sf { fill: #eb6834; }
  .line { fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
  @media (prefers-color-scheme: dark) {
    .ink { fill: #e6edf3; } .mut { fill: #9198a1; }
    .grid { stroke: #30363d; } .axis { stroke: #6e7681; } .kink { stroke: #6e7681; }
    .b { stroke: #3987e5; } .s { stroke: #d95926; } .bf { fill: #3987e5; } .sf { fill: #d95926; }
  }
</style>
<text class="ink" x="66" y="26" font-size="16" font-weight="600">Interest rate by utilization</text>
<text class="mut" x="66" y="46" font-size="12.5">annual rates, as computed by getBorrowRate and getSupplyRate</text>
<line class="line b" x1="482" x2="504" y1="20" y2="20"/><text class="ink" x="512" y="24" font-size="12.5">Borrowers pay (borrow)</text>
<line class="line s" x1="482" x2="504" y1="40" y2="40"/><text class="ink" x="512" y="44" font-size="12.5">Depositors earn (supply = borrow × U)</text>
<line class="grid" x1="66" x2="732" y1="372.0" y2="372.0"/><text class="mut" x="56" y="376.0" font-size="12" text-anchor="end">0 %</text>
<line class="grid" x1="66" x2="732" y1="295.0" y2="295.0"/><text class="mut" x="56" y="299.0" font-size="12" text-anchor="end">20 %</text>
<line class="grid" x1="66" x2="732" y1="218.0" y2="218.0"/><text class="mut" x="56" y="222.0" font-size="12" text-anchor="end">40 %</text>
<line class="grid" x1="66" x2="732" y1="141.0" y2="141.0"/><text class="mut" x="56" y="145.0" font-size="12" text-anchor="end">60 %</text>
<line class="grid" x1="66" x2="732" y1="64.0" y2="64.0"/><text class="mut" x="56" y="68.0" font-size="12" text-anchor="end">80 %</text>
<text class="mut" x="66.0" y="390" font-size="12" text-anchor="start">0 %</text>
<text class="mut" x="132.6" y="390" font-size="12" text-anchor="middle">10 %</text>
<text class="mut" x="199.2" y="390" font-size="12" text-anchor="middle">20 %</text>
<text class="mut" x="265.8" y="390" font-size="12" text-anchor="middle">30 %</text>
<text class="mut" x="332.4" y="390" font-size="12" text-anchor="middle">40 %</text>
<text class="mut" x="399.0" y="390" font-size="12" text-anchor="middle">50 %</text>
<text class="mut" x="465.6" y="390" font-size="12" text-anchor="middle">60 %</text>
<text class="mut" x="532.2" y="390" font-size="12" text-anchor="middle">70 %</text>
<text class="mut" x="598.8" y="390" font-size="12" text-anchor="middle">80 %</text>
<text class="mut" x="665.4" y="390" font-size="12" text-anchor="middle">90 %</text>
<text class="mut" x="732.0" y="390" font-size="12" text-anchor="end">100 %</text>
<line class="axis" x1="66" x2="732" y1="372" y2="372"/>
<text class="ink" x="399.0" y="420" font-size="13" text-anchor="middle">Utilization = borrowed ÷ supplied</text>
<line class="kink" x1="598.8" x2="598.8" y1="64" y2="372"/>
<text class="mut" x="590.8" y="78" font-size="12" text-anchor="end">gentle slope up to the 80 % kink</text>
<text class="mut" x="606.8" y="78" font-size="12">steep after it</text>
